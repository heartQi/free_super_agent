networks:
    ai_network:
        driver: bridge
services:
    duix-gen-video:
        image: wupeiqi/duix
        container_name: duix-gen-video
        restart: always
        runtime: nvidia
        privileged: true
        volumes:
            - ./data:/code/data
        environment:
            - PYTORCH_CUDA_ALLOC_CONF=max_split_size_mb:512
        deploy:
            resources:
                reservations:
                    devices:
                        - capabilities: [gpu]
        shm_size: '6g'
        ports:
            - '8383:8383'
        networks:
            - ai_network
